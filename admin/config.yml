# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Admin panel for lizpop.art. Every save becomes a commit in the GitHub repo,
# so every change can be undone from the repo's history.

backend:
  name: github
  repo: burmar14/lizpop-site
  branch: main
  commit_messages:
    create: "Add {{collection}} \"{{slug}}\""
    update: "Update {{collection}} \"{{slug}}\""
    delete: "Delete {{collection}} \"{{slug}}\""
    uploadMedia: "Upload \"{{path}}\""
    deleteMedia: "Delete \"{{path}}\""

site_url: https://lizpop.art
display_url: https://lizpop.art

media_folder: images/uploads
public_folder: /images/uploads

# Uploaded photos are resized and converted to WebP in the browser before they're saved,
# so big phone photos don't slow the site down.
media_libraries:
  default:
    config:
      max_file_size: 15000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1800
          height: 1800

collections:
  - name: quotes
    label: Quotes
    icon: format_quote
    description: Short, lighthearted reminders. One shows on the home page each day.
    files:
      - name: quotes
        label: Quote list
        file: content/quotes.json
        fields:
          - { name: moods, label: Feelings people can pick, widget: list, hint: "Shown as buttons on the Extras page. Spell them the same way in each quote below." }
          - name: items
            label: Quotes
            label_singular: Quote
            widget: list
            summary: "{{fields.text}}"
            add_to_top: true
            fields:
              - { name: text, label: Quote, widget: string, hint: "Keep it short and kind, one or two lines." }
              - { name: moods, label: Feelings it fits, widget: list, required: false, hint: "Which feeling buttons on the Extras page should show this quote." }
              - { name: show, label: Show on site, widget: boolean, default: true }

  - name: prints
    label: Prints
    icon: palette
    description: New Etsy listings are added here automatically every morning. Reorder them, edit the text, or switch off "Show on site".
    files:
      - name: prints
        label: Print wall
        file: content/prints.json
        fields:
          - name: items
            label: Prints
            label_singular: Print
            widget: list
            summary: "{{fields.title}}"
            add_to_top: true
            fields:
              - { name: title, label: Title, widget: string }
              - { name: image, label: Image, widget: image, hint: "A photo of the print. Upload or paste an image link." }
              - { name: alt, label: Image description, widget: string, hint: "What's in the picture, for people using screen readers. Example: Pink character napping in the grass." }
              - { name: etsy_url, label: Etsy listing link, widget: string, required: false, hint: "Leave blank to link to the whole shop." }
              - { name: moods, label: Feelings, widget: list, required: false, hint: "Which Shop by feeling buttons this print shows under. Use the same words as the list in Page text and links > Shop." }
              - { name: show, label: Show on site, widget: boolean, default: true }
              - { name: etsy_id, label: Etsy ID (set automatically), widget: hidden }

  - name: portfolio
    label: Brand portfolio
    icon: work
    description: Brand videos and illustration work shown at lizpop.art/portfolio.
    files:
      - name: portfolio
        label: Portfolio projects
        file: content/portfolio.json
        fields:
          - name: items
            label: Projects
            label_singular: Project
            widget: list
            summary: "{{fields.client}}: {{fields.title}}"
            add_to_top: true
            fields:
              - { name: title, label: Project title, widget: string }
              - { name: client, label: Brand or client, widget: string, required: false }
              - name: type
                label: Type
                widget: select
                default: influencer
                options:
                  - { label: Influencer video, value: influencer }
                  - { label: Animation, value: animation }
                  - { label: Illustration, value: illustration }
              - { name: thumbnail, label: Cover image, widget: image, hint: "For videos, a screenshot from the video works well. Tall (4:5) looks best." }
              - { name: alt, label: Cover image description, widget: string }
              - name: video_url
                label: Video link
                widget: string
                required: false
                hint: "Paste the Instagram, TikTok, YouTube or Vimeo link. YouTube and Vimeo play on the site; Instagram and TikTok open in a new tab."
              - name: orientation
                label: Video shape
                widget: select
                default: vertical
                options:
                  - { label: "Tall (Reels, TikTok, Shorts)", value: vertical }
                  - { label: "Wide (YouTube, Vimeo)", value: horizontal }
              - name: gallery
                label: Extra images (illustration projects)
                label_singular: Image
                widget: list
                required: false
                fields:
                  - { name: image, label: Image, widget: image }
                  - { name: alt, label: Description, widget: string, required: false }
              - { name: description, label: Short description, widget: text, required: false, hint: "One or two sentences on what you made and why." }
              - { name: link_url, label: Link to original post, widget: string, required: false }
              - { name: tags, label: Tags, widget: list, required: false, hint: "For example: mental health, events, tech" }
              - { name: topics, label: Brand topics, widget: list, required: false, hint: "Which topic buttons on this page should show this piece. Spell them exactly like the topic buttons (for example Wellness, Tech & gaming)." }
              - { name: featured, label: Feature on home page, widget: boolean, default: false, hint: "Up to 3 featured projects show on the home page." }
              - { name: show, label: Show on site, widget: boolean, default: true }

  - name: pages
    label: Page text and links
    icon: edit_note
    files:
      - name: site
        label: Home page, book, brand info and links
        file: content/site.json
        fields:
          - name: hero
            label: Top of home page
            widget: object
            fields:
              - { name: kicker, label: Small line above the headline, widget: string }
              - { name: headline, label: Headline, widget: string }
              - { name: highlight, label: Pink highlighted word, widget: string }
              - { name: kickers, label: More small lines, widget: list, required: false, hint: "The small line above the headline. One is picked at random each visit, along with the one above." }
              - name: headlines
                label: More headlines
                label_singular: Headline
                widget: list
                required: false
                summary: "{{fields.headline}} {{fields.highlight}}"
                hint: "One is picked at random each visit, along with the one above. The pink word goes at the end."
                fields:
                  - { name: headline, label: Headline, widget: string }
                  - { name: highlight, label: Pink highlighted word, widget: string }
              - { name: intro, label: Intro, widget: text }
              - name: slides
                label: Rotating artwork
                label_singular: Artwork
                widget: list
                summary: "{{fields.alt}}"
                hint: "These fade from one to the next at the top of the home page. Tall pieces (4:5) look best."
                fields:
                  - { name: image, label: Image, widget: image }
                  - { name: alt, label: Description, widget: string }
              - { name: note, label: Small note under buttons, widget: string, required: false }
          - { name: quotes_label, label: Label above the daily quote, widget: string }
          - name: extras
            label: Little extras page
            widget: object
            fields:
              - { name: title, label: Page title, widget: string }
              - { name: intro, label: Intro, widget: text }
              - { name: mood_title, label: Heading above the feeling buttons, widget: string }
              - { name: mood_intro, label: Line under that heading, widget: string }
              - { name: nature_title, label: Heading for the moon and season, widget: string }
              - name: walk
                label: The little walk game
                widget: object
                fields:
                  - { name: ladybug_lines, label: What the ladybug says when it flies by, widget: list, hint: "Short and kind. One is picked at random each time." }
              - name: moon
                label: Moon notes (in order from new moon to waning crescent)
                label_singular: Moon phase
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: Phase name, widget: string }
                  - { name: line, label: Note, widget: string }
              - name: seasons
                label: Season notes (winter, spring, summer, autumn)
                label_singular: Season
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: Season, widget: string }
                  - { name: line, label: Note, widget: string }
          - name: share
            label: Send a reminder
            widget: object
            fields:
              - { name: button, label: Button text, widget: string }
              - { name: heading, label: Popup heading, widget: string }
              - { name: intro, label: Popup intro, widget: string }
              - name: art
                label: Doodles people can send
                label_singular: Doodle
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Name in the dropdown, widget: string }
                  - { name: image, label: Image, widget: image }
                  - { name: preview, label: Text preview image (set automatically), widget: hidden }
          - name: loved
            label: Most loved (top animations)
            widget: object
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: intro, label: Intro, widget: string }
              - name: items
                label: Pieces
                label_singular: Piece
                widget: list
                summary: "{{fields.views}} {{fields.title}}"
                hint: "Her best performers. Order them by views, biggest first. Update the view counts now and then."
                fields:
                  - { name: image, label: Cover image, widget: image }
                  - { name: title, label: Title, widget: string }
                  - { name: views, label: Views, widget: string, required: false, hint: "Like 10.9M" }
                  - { name: url, label: Link to the reel, widget: string }
                  - { name: show, label: Show on site, widget: boolean, default: true }
              - { name: tabs, label: Tab names on the home page, widget: list, required: false, hint: "First tab shows the pieces above, second shows the studio and fun videos below." }
              - { name: videos_intro, label: Intro for the second tab, widget: string, required: false }
              - name: videos
                label: Studio and fun videos (home page)
                label_singular: Video
                widget: list
                summary: "{{fields.views}} {{fields.title}}"
                hint: "Just-for-fun videos with no brand. They show on the home page. Order them by views, biggest first."
                fields:
                  - { name: image, label: Cover image, widget: image }
                  - { name: title, label: Title, widget: string }
                  - { name: brand, label: Brand (if a partnership), widget: string, required: false }
                  - { name: views, label: Views, widget: string, required: false }
                  - { name: url, label: Link to the video, widget: string }
                  - { name: show, label: Show on site, widget: boolean, default: true }
              - { name: brand_videos_title, label: Heading above the partner videos (For brands page), widget: string, required: false }
              - { name: brand_videos_intro, label: Line under that heading, widget: string, required: false }
              - name: brand_videos
                label: Partner videos (For brands page)
                label_singular: Video
                widget: list
                summary: "{{fields.views}} {{fields.brand}}: {{fields.title}}"
                hint: "Videos made with brands. They show on the For brands page. Order them by views, biggest first."
                fields:
                  - { name: image, label: Cover image, widget: image }
                  - { name: title, label: Title, widget: string }
                  - { name: brand, label: Brand, widget: string }
                  - { name: views, label: Views, widget: string, required: false }
                  - { name: url, label: Link to the video, widget: string }
                  - { name: show, label: Show on site, widget: boolean, default: true }
          - name: studio
            label: From the studio
            widget: object
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: intro, label: Intro, widget: string }
              - name: items
                label: Studio clips
                label_singular: Clip
                widget: list
                summary: "{{fields.caption}}"
                fields:
                  - { name: image, label: Cover image, widget: image }
                  - { name: caption, label: Caption, widget: string }
                  - { name: url, label: Link to the reel or TikTok, widget: string }
          - name: newsletter
            label: Monthly email
            widget: object
            fields:
              - { name: show, label: Show the signup on the site, widget: boolean, default: false, hint: "Off for now. The signup only appears when this is on AND a Buttondown username is filled in below." }
              - { name: title, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: button, label: Button text, widget: string }
              - { name: buttondown_username, label: Buttondown username, widget: string, required: false, hint: "Make a free account at buttondown.com and put the username here. The signup form turns on once this is filled in." }
          - name: footer
            label: Footer art (swap by season)
            widget: object
            fields:
              - name: style
                label: Footer style
                widget: select
                default: characters
                options:
                  - { label: "Waving characters", value: characters }
                  - { label: "Framed art pieces", value: scenes }
              - { name: sky, label: Sky color behind the characters, widget: color, required: false }
              - { name: greetings, label: Speech bubble lines, widget: list, required: false, hint: "Tapping a character makes them hop and switches to the next line." }
              - { name: color, label: Background color (framed art style), widget: color }
              - { name: leaves, label: Falling leaves, widget: boolean, default: true }
              - name: scenes
                label: Footer pieces
                label_singular: Piece
                widget: list
                hint: "The middle one sways front and center. Two or three pieces look best."
                summary: "{{fields.alt}}"
                fields:
                  - { name: image, label: Image, widget: image }
                  - { name: alt, label: Description, widget: string }
          - name: shop
            label: Shop
            widget: object
            fields:
              - { name: etsy_url, label: Etsy shop link, widget: string }
              - { name: prints_intro, label: Line under "Prints for your walls", widget: string }
              - { name: moods_label, label: Label for feeling buttons, widget: string, default: Shop by feeling }
              - { name: moods, label: Feeling buttons, widget: list, hint: "For example: Calm, Brave, Healing, Philly, Gift for a friend" }
              - name: reviews
                label: Customer reviews
                label_singular: Review
                widget: list
                summary: "{{fields.name}}: {{fields.text}}"
                fields:
                  - { name: text, label: Review, widget: string, hint: "Copy a short line from a real Etsy review." }
                  - { name: name, label: First name, widget: string, required: false }
              - { name: max_prints, label: How many prints to show on the home page, widget: number, value_type: int, default: 12, min: 4, max: 40 }
          - name: book
            label: Book
            widget: object
            fields:
              - { name: kicker, label: Small line above the title, widget: string, hint: "Change this after release day, for example: Out now" }
              - { name: title, label: Title, widget: string }
              - { name: cover, label: Cover image, widget: image }
              - { name: description, label: Description, widget: text }
              - { name: details, label: Details line, widget: string, required: false }
              - { name: amazon_url, label: Amazon link, widget: string }
              - { name: amazon_label, label: Amazon button text, widget: string }
              - name: other_links
                label: Other places to buy
                label_singular: Store
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Button text, widget: string }
                  - { name: url, label: Link, widget: string }
              - { name: bonus_text, label: Preorder bonus text, widget: string, required: false }
              - { name: bonus_url, label: Preorder bonus form link, widget: string, required: false, hint: "Leave blank to hide the bonus line." }
              - name: previews
                label: Peek inside (book pages)
                label_singular: Page
                widget: list
                fields:
                  - { name: image, label: Image, widget: image }
                  - { name: alt, label: Description, widget: string }
          - { name: events_intro, label: Line under "Come say hi", widget: string }
          - name: events
            label: Events and markets
            label_singular: Event
            widget: list
            summary: "{{fields.date}} {{fields.title}}"
            add_to_top: true
            hint: "Events with a date disappear from the site automatically the day after."
            fields:
              - { name: title, label: Event name, widget: string }
              - { name: date, label: Date, widget: datetime, time_format: false, format: "YYYY-MM-DD", required: false, hint: "Leave blank if the date isn't set yet." }
              - { name: when, label: Custom time text, widget: string, required: false, hint: "Optional. For example: Sat Nov 8, 11am to 4pm. Shown instead of the date." }
              - { name: place, label: Where, widget: string, required: false }
              - { name: details, label: Details, widget: string, required: false }
              - { name: url, label: Link, widget: string, required: false }
              - { name: link_label, label: Button text, widget: string, required: false, default: Details }
              - { name: show, label: Show on site, widget: boolean, default: true }
          - name: markets
            label: Market photos
            widget: object
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: intro, label: Intro line, widget: string, required: false }
              - name: photos
                label: Photos
                label_singular: Photo
                widget: list
                summary: "{{fields.caption}}"
                add_to_top: true
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: caption, label: Caption, widget: string, required: false, hint: "Short, like: Clark Park, fall 2025" }
                  - { name: alt, label: Photo description, widget: string, required: false }
          - name: brand
            label: Brand work info
            widget: object
            fields:
              - { name: headline, label: Headline, widget: string }
              - { name: intro, label: Intro, widget: text }
              - { name: topics, label: Topics, widget: list }
              - name: stats
                label: Stats
                label_singular: Stat
                widget: list
                summary: "{{fields.value}} {{fields.label}}"
                fields:
                  - { name: value, label: Number, widget: string }
                  - { name: label, label: Label, widget: string }
              - { name: clients_label, label: Label above client names, widget: string, default: Worked with }
              - { name: clients, label: Clients and brands, widget: list, hint: "Shown as a row of names on the home page and portfolio. First ones show first." }
              - { name: rep_text, label: Management line, widget: string }
              - { name: rep_email, label: Partnerships email, widget: string }
              - { name: media_kit, label: Media kit (PDF), widget: file, required: false }
          - name: about
            label: About
            widget: object
            fields:
              - { name: photo, label: Photo of Liz, widget: image, required: false }
              - { name: photo_caption, label: Photo caption, widget: string, required: false }
              - { name: body, label: About text, widget: text, hint: "Leave a blank line between paragraphs." }
          - name: social
            label: Social links
            widget: object
            fields:
              - { name: instagram, label: Instagram, widget: string }
              - { name: tiktok, label: TikTok, widget: string, required: false }
              - { name: coffee, label: Buy me a coffee, widget: string, required: false }
